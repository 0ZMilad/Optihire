name: optihire
region: nyc

services:
  - name: optihire-api
    source_dir: apps/backend
    dockerfile_path: apps/backend/Dockerfile
    github:
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/v1/system/health
    envs:
      # --- Required secrets (set values in DO dashboard) ---
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET

      # --- CORS: your Vercel frontend URL ---
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: "https://your-app.vercel.app"

      # --- Docs (disabled in production for security) ---
      - key: DOCS_ENABLED
        scope: RUN_TIME
        value: "false"

      # --- AI / LLM (optional) ---
      - key: AI_ENHANCE_ENABLED
        scope: RUN_TIME
        value: "false"
      - key: LITELLM_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: LLM_PROVIDER
        scope: RUN_TIME
        value: "gemini/gemini-2.5-flash"
      - key: LITELLM_MAX_TOKENS
        scope: RUN_TIME
        value: "4000"
      - key: MAX_AI_CALLS_PER_DAY
        scope: RUN_TIME
        value: "10"
